name: CI

on:
  push:
    branches:
      - main
      - refactor/reerts-monorepo
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Typecheck (Backend & Orchestrator)
        run: |
          pnpm --filter @reerts/backend exec tsc --noEmit
          pnpm --filter @reerts/orchestrator exec tsc --noEmit
          pnpm --filter @reerts/helpers exec tsc --noEmit
          pnpm --filter @reerts/integrations exec tsc --noEmit

      - name: Next.js Frontend Build Test
        run: pnpm build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
