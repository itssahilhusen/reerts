name: CI

on:
  push:
    branches:
      - main
      - refactor/reerts-monorepo
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.21.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Typecheck (Frontend, Backend, Orchestrator & Libraries)
        run: |
          pnpm --filter @reerts/frontend exec tsc --noEmit
          pnpm --filter @reerts/backend exec tsc --noEmit
          pnpm --filter @reerts/orchestrator exec tsc --noEmit
          pnpm --filter @reerts/helpers exec tsc --noEmit
          pnpm --filter @reerts/integrations exec tsc --noEmit

      - name: Next.js Frontend Build Test
        run: pnpm build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
